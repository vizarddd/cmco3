  :root {
    --yellow: #f9df6d; --green: #a0c35a; --blue: #b0c4ef; --purple: #ba81c5;
    --tile: #efefe6; --selected: #5a594e; --splash: #b4a8ff; --grey: #7f7f7f;
    --tile-h: 80px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: 'Libre Franklin', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; color: inherit; }

  /* ---------- Splash (one per chapter) ---------- */
  #splash {
    position: fixed; inset: 0; background: var(--splash); z-index: 60;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; opacity: 1; transition: opacity .45s ease;
  }
  #splash.hidden { opacity: 0; pointer-events: none; }
  #splash .icon { width: 64px; height: 64px; margin-bottom: 16px; }
  #splash h1 { font-family: 'Zilla Slab', Georgia, serif; font-weight: 700; font-size: 44px; line-height: 1.05; margin: 0 0 12px; letter-spacing: -0.5px; }
  #splash .sub { font-size: 28px; font-weight: 300; line-height: 1.25; max-width: 420px; margin: 0 0 28px; }
  #splash .play { background: #000; color: #fff; border: none; border-radius: 32px; height: 48px; min-width: 150px; font-size: 16px; font-weight: 600; cursor: pointer; }
  #splash .meta { margin-top: 28px; font-size: 16px; line-height: 1.5; }
  #splash .meta b { font-weight: 700; display: block; }

  /* ---------- Header ---------- */
  header.bar { height: 64px; border-bottom: 1px solid #dcdcdc; display: flex; align-items: center; padding: 0 20px; gap: 14px; }
  header.bar .name { font-family: 'Zilla Slab', Georgia, serif; font-weight: 700; font-size: 26px; letter-spacing: -0.3px; }
  header.bar .date { font-size: 18px; font-weight: 300; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header.bar .spacer { flex: 1; }
  .iconbtn { background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 6px 4px; font-size: 16px; font-weight: 600; }
  .iconbtn svg { width: 24px; height: 24px; }
  .iconbtn:disabled { opacity: .35; cursor: default; }

  /* ---------- Game ---------- */
  main { width: 100%; max-width: 640px; margin: 0 auto; padding: 0 8px 48px; position: relative; }
  .instructions { text-align: center; font-size: 18px; font-weight: 300; margin: 24px 0 22px; }

  #hintBar { display: none; justify-content: center; margin: -8px 0 14px; }
  #hintBar.show { display: flex; }
  #hintBar .pillhint {
    display: inline-flex; align-items: center; gap: 10px; border-radius: 6px; padding: 9px 14px;
    font-size: 15px; text-transform: uppercase; animation: reveal .3s ease-out; max-width: 100%;
  }
  #hintBar .pillhint .lbl { font-weight: 400; letter-spacing: .04em; font-size: 13px; }
  #hintBar .pillhint .cat { font-weight: 700; }

  #board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; position: relative; }
  .tile {
    height: var(--tile-h); border: none; border-radius: 6px; background: var(--tile);
    font-weight: 700; font-size: 20px; text-transform: uppercase; line-height: 1.1;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 0 6px; cursor: pointer; user-select: none; overflow: hidden; position: relative;
    overflow-wrap: normal; word-break: keep-all; transition: background-color .12s ease, color .12s ease;
  }
  .tile span { display: block; }
  .tile.selected { background: var(--selected); color: #fff; }
  .tile:active { transform: scale(.98); }
  .tile.hinted::after { content: ''; position: absolute; inset: 0; border-radius: 6px; box-shadow: inset 0 0 0 3px var(--hc); pointer-events: none; }
  .tile.jump { animation: jump .35s ease-in-out; }
  .tile.shake { animation: shake .3s linear; }
  @keyframes jump { 0%{transform:translateY(0)} 50%{transform:translateY(-8px)} 100%{transform:translateY(0)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }

  .solved {

<script>
(() => {
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  let ch = 0, st = null, busy = false, cdRaf = null;
  $('hName').textContent = GAME.title;

  /* ---------- Chapter flow: splash -> (intro) -> grid -> results -> countdown -> next splash ---------- */
  function showSplash(i) {
    ch = i;
    const c = GAME.chapters[i];
    $('sTitle').textContent = GAME.title;
    $('sSub').textContent = c.label;
    $('sNo').textContent = 'No. ' + (i + 1);
    $('splash').classList.remove('hidden');
    $('playBtn').onclick = () => { $('splash').classList.add('hidden'); openChapter(i); };
  }

  function openChapter(i) {
    const c = GAME.chapters[i];
    $('hDate').textContent = c.label;
    $('modal').classList.remove('show');
    if (c.intro && c.intro.trim()) {
      $('game').style.display = 'none';
      $('inter').style.display = 'block';
      $('iDate').textContent = 'No. ' + (ch + 1);
      $('iTitle').textContent = c.label;
      $('iText').textContent = c.intro;
      $('iBtn').onclick = () => { $('inter').style.display = 'none'; startGrid(); };
    } else {
      $('inter').style.display = 'none';
      startGrid();
    }
  }

  function startGrid() {
    const c = GAME.chapters[ch];
    const words = [];
    c.groups.forEach((g, gi) => g.words.forEach(w => words.push({ w, g: gi })));
    st = { remaining: shuffle(words), solved: [], selected: [], mistakes: 4, guesses: [], seen: new Set(), over: false,
           hintGroup: null, hintStep: 0, hints: 0 };
    $('game').style.display = 'block';
    $('controls').style.display = 'flex';
    $('mistakesWrap').style.display = 'flex';
    $('after').classList.remove('show');
    $('hintBtn').disabled = false;
    render();
    window.scrollTo(0, 0);
  }

  /* ---------- Rendering ---------- */
  function hintedWords() {
    if (st.hintGroup === null || st.hintStep < 2) return [];
    return GAME.chapters[ch].groups[st.hintGroup].words.slice(0, st.hintStep === 2 ? 1 : 3);
  }

  function render(revealIdx) {
    const board = $('board');
    board.innerHTML = '';
    const c = GAME.chapters[ch];
    st.solved.forEach((gi, k) => {
      const g = c.groups[gi];
      const d = document.createElement('div');
      d.className = 'solved c' + g.level + (g.caption ? ' has-cap' : '') + (k === revealIdx ? ' reveal' : '');
      d.innerHTML = '<h3></h3><p></p>' + (g.caption ? '<div class="cap"></div>' : '');
      d.querySelector('h3').textContent = g.name;
      d.querySelector('p').textContent = g.words.join(', ');
      if (g.caption) d.querySelector('.cap').textContent = g.caption;
      board.appendChild(d);
    });
    const hw = hintedWords();
    const hlevel = st.hintGroup !== null ? c.groups[st.hintGroup].level : 0;
    st.remaining.forEach(item => {
      const b = document.createElement('button');
      let cls = 'tile' + (st.selected.includes(item) ? ' selected' : '');
      if (item.g === st.hintGroup && hw.includes(item.w)) cls += ' hinted c' + hlevel;
      b.className = cls;
      if (cls.includes('hinted')) b.style.background = st.selected.includes(item) ? '' : 'var(--tile)';
      b.innerHTML = '<span></span>';
      b.firstChild.textContent = item.w;
      b._item = item;
      b.onclick = () => toggle(item, b);
      board.appendChild(b);
    });
    renderHintBar();
    renderDots();
    updateButtons();
    fitText();
  }

  function renderHintBar() {
    const bar = $('hintBar');
    if (st.hintGroup === null || st.solved.includes(st.hintGroup) || st.over) { bar.classList.remove('show'); bar.innerHTML = ''; return; }
    const g = GAME.chapters[ch].groups[st.hintGroup];
    bar.innerHTML = '<span class="pillhint c' + g.level + '"><span class="lbl">Hint</span><span class="cat"></span></span>';
    bar.querySelector('.cat').textContent = g.name;
    bar.classList.add('show');
  }

  function fitText() {
    const small = window.innerWidth <= 520;
    document.querySelectorAll('.tile').forEach(t => {
      const s = t.firstChild;
      let size = small ? 16 : 20;
      t.style.fontSize = size + 'px';
      while (size > 9 && (s.scrollWidth > t.clientWidth - (small ? 6 : 12) || s.offsetHeight > t.clientHeight - 8)) {
        size -= 0.5; t.style.fontSize = size + 'px';
      }
    });
    document.querySelectorAll('.solved').forEach(r => {
      ['h3', 'p'].forEach(sel => {
        const el = r.querySelector(sel);
        let size = small ? 16 : 20;
        el.style.fontSize = size + 'px';
        el.style.whiteSpace = 'nowrap';
        while (size > 13 && el.scrollWidth > r.clientWidth - 24) { size -= 0.5; el.style.fontSize = size + 'px'; }
        if (el.scrollWidth > r.clientWidth - 24) el.style.whiteSpace = 'normal';
      });
    });
  }
  window.addEventListener('resize', () => { if (st) fitText(); });

  function renderDots() {
    const dots = $('dots');
    if (dots.children.length !== 4) { dots.innerHTML = ''; for (let i = 0; i < 4; i++) { const d = document.createElement('span'); d.className = 'dot'; dots.appendChild(d); } }
    [...dots.children].forEach((d, i) => d.classList.toggle('gone', i >= st.mistakes));
  }

  function updateButtons() {
    $('submitBtn').disabled = st.selected.length !== 4 || busy || st.over;
    $('deselectBtn').disabled = st.selected.length === 0 || busy || st.over;
    $('shuffleBtn').disabled = busy || st.over;
    $('hintBtn').disabled = busy || st.over;
  }

  /* ---------- Interaction ---------- */
  function toggle(item, el) {
    if (busy || st.over) return;
    const i = st.selected.indexOf(item);
    if (i >= 0) { st.selected.splice(i, 1); }
    else if (st.selected.length < 4) { st.selected.push(item); }
    else return;
    render();
  }

  $('shuffleBtn').onclick = () => { if (busy) return; st.remaining = shuffle(st.remaining); render(); };
  $('deselectBtn').onclick = () => { if (busy) return; st.selected = []; render(); };
  $('submitBtn').onclick = submit;

  // Up to 3 hints per group: 1st names the easiest unsolved group, 2nd outlines one of its words, 3rd outlines three (one left to find).
  $('hintBtn').onclick = () => {
    if (!st || busy || st.over) return;
    const c = GAME.chapters[ch];
    if (st.hintGroup === null || st.solved.includes(st.hintGroup)) {
      const open = [...new Set(st.remaining.map(x => x.g))].sort((a, b) => c.groups[a].level - c.groups[b].level);
      if (!open.length) return;
      st.hintGroup = open[0]; st.hintStep = 1; st.hints++;
    } else if (st.hintStep < 3) {
      st.hintStep++; st.hints++;
    } else {
      toast('No more hints for this group'); return;
    }
    render();
  };

  let toastTimer = null;
  function toast(msg, ms = 1600) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  async function submit() {
    if (busy || st.selected.length !== 4) return;
    const key = st.selected.map(x => x.w).sort().join('|');
    if (st.seen.has(key)) { toast('Already guessed!'); return; }
    st.seen.add(key);
    busy = true; updateButtons();

    const tiles = [...document.querySelectorAll('.tile')].filter(t => st.selected.includes(t._item));
    tiles.forEach((t, i) => setTimeout(() => { t.classList.add('jump'); setTimeout(() => t.classList.remove('jump'), 360); }, i * 110));
    await sleep(tiles.length * 110 + 380);

    const c = GAME.chapters[ch];
    const sel = st.selected.map(x => x.w);
    const overlap = gw => { const pool = gw.slice(); let n = 0; sel.forEach(w => { const i = pool.indexOf(w); if (i >= 0) { pool.splice(i, 1); n++; } }); return n; };
    let best = 0, match = null;
    c.groups.forEach((g, gi) => { if (st.solved.includes(gi)) return; const o = overlap(g.words); if (o > best) best = o; if (o === 4) match = gi; });
    st.guesses.push(match !== null ? [0, 0, 0, 0].map(() => c.groups[match].level) : st.selected.map(x => c.groups[x.g].level));

    if (match !== null) {
      st.solved.push(match);
      st.remaining = st.remaining.filter(x => !st.selected.includes(x));
      st.selected = [];
      reassign();
      busy = false;
      render(st.solved.length - 1);
      if (st.remaining.length === 0) finish(true);
    } else {
      tiles.forEach(t => t.classList.add('shake'));
      await sleep(320);
      tiles.forEach(t => t.classList.remove('shake'));
      st.mistakes--;
      renderDots();
      if (best === 3 && st.mistakes > 0) toast('One away...');
      busy = false;
      if (st.mistakes === 0) { await revealAll(); finish(false); }
      else updateButtons();
    }
  }

  // Re-match leftover tiles to unsolved groups by word (handles the same word appearing in two groups).
  function reassign() {
    const c = GAME.chapters[ch];
    const free = st.remaining.slice();
    c.groups.forEach((g, gi) => {
      if (st.solved.includes(gi)) return;
      g.words.forEach(w => { const k = free.findIndex(x => x.w === w); if (k >= 0) { free[k].g = gi; free.splice(k, 1); } });
    });
  }

  async function revealAll() {
    st.over = true; busy = true; st.selected = [];
    toast('Next Time', 1400);
    await sleep(900);
    const c = GAME.chapters[ch];
    const left = [...new Set(st.remaining.map(x => x.g))].sort((a, b) => c.groups[a].level - c.groups[b].level);
    for (const gi of left) {
      st.solved.push(gi);
      st.remaining = st.remaining.filter(x => x.g !== gi);
      render(st.solved.length - 1);
      await sleep(700);
    }
    busy = false;
  }

  /* ---------- Results + transition ---------- */
  function finish(won) {
    st.over = true; st.won = won;
    $('controls').style.display = 'none';
    $('mistakesWrap').style.display = 'none';
    renderHintBar(); updateButtons();
    const last = ch === GAME.chapters.length - 1;
    $('afterNext').textContent = last ? 'Play Again' : 'Next Chapter';
    $('afterNext').onclick = goNext;
    $('viewBtn').onclick = openModal;
    $('after').classList.add('show');
    setTimeout(openModal, 900);
  }

  function openModal() {
    const c = GAME.chapters[ch];
    const titles = ['Next Time!', 'Phew!', 'Solid!', 'Great!', 'Perfect!'];
    $('rTitle').textContent = st.won ? titles[st.mistakes] : titles[0];
    let sub = c.label;
    if (st.hints) sub += ' · ' + st.hints + (st.hints === 1 ? ' hint' : ' hints');
    $('rSub').textContent = sub;
    const grid = $('rGrid'); grid.innerHTML = '';
    st.guesses.forEach(row => {
      const r = document.createElement('div'); r.className = 'rrow';
      row.forEach(l => { const s = document.createElement('div'); s.className = 'rsq c' + l; r.appendChild(s); });
      grid.appendChild(r);
    });
    const last = ch === GAME.chapters.length - 1;
    const nxt = GAME.chapters[ch + 1];
    $('nLabel').textContent = last ? GAME.finale.label : 'Next Chapter In';
    $('nextBtn').textContent = last ? 'Play Again' : 'Play No. ' + (ch + 2);
    $('nextBtn').onclick = goNext;
    $('modal').classList.add('show');
    if (last) runLive();
    else runCountdown(nxt.gap || 90);
  }

  // Fast-forwards a semester-sized countdown to zero, like the "Next Puzzle In" timer.
  function runCountdown(days) {
    cancelAnimationFrame(cdRaf);
    const total = days * 86400, dur = 2600, t0 = performance.now();
    const fmt = s => {
      const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = Math.floor(s % 60);
      return h.toLocaleString() + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    };
    $('cdSub').textContent = '';
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      $('cd').textContent = fmt(total * (1 - eased));
      if (p < 1) cdRaf = requestAnimationFrame(step);
    };
    cdRaf = requestAnimationFrame(step);
  }

  // After the last chapter the clock stops fast-forwarding and counts down in real time.
  let liveTimer = null;
  function fmtHMS(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = Math.floor(sec % 60);
    return h.toLocaleString() + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
  }
  function runLive() {
    cancelAnimationFrame(cdRaf); clearInterval(liveTimer);
    const target = new Date(GAME.finale.date).getTime();
    const tick = () => { $('cd').textContent = fmtHMS(Math.max(0, (target - Date.now()) / 1000)); };
    tick(); liveTimer = setInterval(tick, 1000);
    $('cdSub').textContent = GAME.finale.note || '';
  }

  function goNext() {
    clearInterval(liveTimer);
    cancelAnimationFrame(cdRaf);
    $('modal').classList.remove('show');
    const last = ch === GAME.chapters.length - 1;
    showSplash(last ? 0 : ch + 1);
  }

  $('closeModal').onclick = () => { cancelAnimationFrame(cdRaf); clearInterval(liveTimer); $('modal').classList.remove('show'); };
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) $('closeModal').onclick(); });

  showSplash(0);
})();
</script>
</body>
</html>
